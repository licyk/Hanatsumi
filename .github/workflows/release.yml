name: Release

# 改动 hanatsumi/version.py、打版本 tag 或手动运行时，全部检查通过后发布到 PyPI。
# 由 tag 触发的运行还会校验 tag 与 hanatsumi/version.py 是否一致。
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['hanatsumi/version.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          python -m ruff check hanatsumi tests
          python -m ruff format --check hanatsumi tests
      - name: Tests
        run: python -m pytest -q
      - name: Python types (ty)
        run: python -m ty check hanatsumi --python "$(command -v python)" --output-format github

  build:
    name: Build the wheel
    needs: [checks]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install --upgrade build twine

      - name: The tag and hanatsumi/version.py agree
        id: version
        run: |
          version=$(python -c "from hanatsumi.version import VERSION; print(VERSION)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $version in hanatsumi/version.py"
              exit 1
            fi
          fi

      - name: Build
        run: python -m build

      - name: Check the metadata
        run: twine check dist/*

      - name: The wheel installs and runs
        run: |
          python -m venv /tmp/probe
          /tmp/probe/bin/pip install --quiet dist/*.whl
          /tmp/probe/bin/hanatsumi version
          /tmp/probe/bin/python -c "import hanatsumi; print(hanatsumi.VERSION)"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # 这个 environment 可以配置为发布前需要人工批准
    environment:
      name: pypi
      url: https://pypi.org/p/hanatsumi
    steps:
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Install Twine
        run: python -m pip install --upgrade twine
      - uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
        run: python -m twine upload dist/* --skip-existing --non-interactive

  github-release:
    name: GitHub release
    needs: [build, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Create the release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
